apiVersion: v1
kind: Service
metadata:
  name: project
spec:
  selector:
    app: project
  ports:
  - name: grpc
    port: 8087
    targetPort: 8087
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: project
  template:
    metadata:
      labels:
        app: project
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
      - name: project
        image: ${PROJECT_IMAGE}
        args:
        - -config
        - /etc/app/config.yaml
        ports:
        - containerPort: 8087
        - name: metrics
          containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/app
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          grpc: &id001
            port: 8087
          periodSeconds: 5
        livenessProbe:
          grpc: *id001
          periodSeconds: 10
        startupProbe:
          grpc: *id001
          periodSeconds: 5
          failureThreshold: 120
        env:
        - name: ADMIN_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: matchlab-admin-verification
              key: public-key
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: matchlab-postgres
              key: password
        - name: PROJECT_SYNC_TOKEN
          valueFrom:
            secretKeyRef:
              name: matchlab-project-sync
              key: token
      volumes:
      - name: config
        configMap:
          name: project-config
