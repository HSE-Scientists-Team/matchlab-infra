apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gateway.yaml
- auth.yaml
- user.yaml
- mail.yaml
- media.yaml
- support.yaml
- project.yaml
- search.yaml
- recommendation.yaml
- admin.yaml
- chat.yaml
- ingress.yaml
- web-ingress.yaml
- api-docs.yaml
- frontend.yaml
configMapGenerator:
- name: gateway-config
  files:
  - config.yaml=config/gateway.yaml
- name: auth-config
  files:
  - config.yaml=config/auth.yaml
- name: user-config
  files:
  - config.yaml=config/user.yaml
- name: mail-config
  files:
  - config.yaml=config/mail.yaml
- name: media-config
  files:
  - config.yaml=config/media.yaml
- name: support-config
  files:
  - config.yaml=config/support.yaml
- name: project-config
  files:
  - config.yaml=config/project.yaml
- name: search-config
  files:
  - config.yaml=config/search.yaml
- name: recommendation-config
  files:
  - config.yaml=config/recommendation.yaml
- name: admin-config
  files:
  - config.yaml=config/admin.yaml
- name: chat-config
  files:
  - config.yaml=config/chat.yaml
patches:
- target:
    kind: Deployment
  patch: |-
    - op: add
      path: /spec/template/spec/imagePullSecrets
      value:
      - name: ghcr-pull
