apiVersion: v1
kind: Service
metadata:
  name: mail
spec:
  selector:
    app: mail
  ports:
  - name: grpc
    port: 8083
    targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mail
  template:
    metadata:
      labels:
        app: mail
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
      - name: mail
        image: ${MAIL_IMAGE}
        args:
        - -config
        - /etc/app/config.yaml
        ports:
        - containerPort: 8083
        volumeMounts:
        - name: config
          mountPath: /etc/app
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          grpc: &id001
            port: 8083
          periodSeconds: 5
        livenessProbe:
          grpc: *id001
          periodSeconds: 10
        startupProbe:
          grpc: *id001
          periodSeconds: 5
          failureThreshold: 120
        env:
        - name: SMTP_USERNAME
          valueFrom:
            secretKeyRef:
              name: matchlab-smtp
              key: username
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: matchlab-smtp
              key: password
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: matchlab-postgres
              key: password
      volumes:
      - name: config
        configMap:
          name: mail-config
