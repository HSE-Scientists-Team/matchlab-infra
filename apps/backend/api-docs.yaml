apiVersion: v1
kind: Service
metadata:
  name: api-docs
spec:
  selector:
    app: api-docs
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-docs
  template:
    metadata:
      labels:
        app: api-docs
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
      - name: api-docs
        image: ${API_DOCS_IMAGE}
        env:
        - name: GATEWAY_URL
          value: http://gateway:8080
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /docs/
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /docs/
            port: 8080
          periodSeconds: 10
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: tmp
        emptyDir: {}
      - name: nginx-config
        emptyDir: {}
