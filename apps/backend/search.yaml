apiVersion: v1
kind: Service
metadata:
  name: search
spec:
  selector:
    app: search
  ports:
  - name: grpc
    port: 8088
    targetPort: 8088
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
      - name: search
        image: ${SEARCH_IMAGE}
        args:
        - -config
        - /etc/app/config.yaml
        ports:
        - containerPort: 8088
        - name: metrics
          containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/app
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          grpc: &id001
            port: 8088
          periodSeconds: 5
        livenessProbe:
          grpc: *id001
          periodSeconds: 10
        startupProbe:
          grpc: *id001
          periodSeconds: 5
          failureThreshold: 120
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: matchlab-postgres
              key: password
      volumes:
      - name: config
        configMap:
          name: search-config
