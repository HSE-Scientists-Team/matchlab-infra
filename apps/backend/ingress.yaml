apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - api.matchlab.space
    secretName: matchlab-api-tls
  rules:
  - host: api.matchlab.space
    http:
      paths:
      - path: /matchlab-media
        pathType: Prefix
        backend:
          service:
            name: seaweedfs
            port:
              number: 8333
      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 8080
      - path: /docs
        pathType: Prefix
        backend:
          service:
            name: api-docs
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 8080

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-http-redirect
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: matchlab-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: api.matchlab.space
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 8080
