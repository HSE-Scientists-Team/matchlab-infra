apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
  - hosts: [matchlab.space]
    secretName: matchlab-web-tls
  rules:
  - host: matchlab.space
    http:
      paths:
      - path: /api/v1/admin
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-http-redirect
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: matchlab-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: matchlab.space
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 8080
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: web-origin-redirect
spec:
  redirectRegex:
    regex: '^https://api\.matchlab\.space/(.*)$'
    replacement: 'https://matchlab.space/$1'
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legacy-web-redirect
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: matchlab-web-origin-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts: [api.matchlab.space]
    secretName: matchlab-api-tls
  rules:
  - host: api.matchlab.space
    http:
      paths:
      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 8080
      - path: /grafana
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: docs-api-redirect
spec:
  redirectRegex:
    regex: '^https://matchlab\.space/docs(.*)$'
    replacement: 'https://api.matchlab.space/docs$1'
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-docs-redirect
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: matchlab-docs-api-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts: [matchlab.space]
    secretName: matchlab-web-tls
  rules:
  - host: matchlab.space
    http:
      paths:
      - path: /docs
        pathType: Prefix
        backend:
          service:
            name: api-docs
            port:
              number: 8080
