apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- prometheus.yaml
- grafana.yaml
- node-exporter.yaml
- kube-state-metrics.yaml
- rbac.yaml
- ingress.yaml
- network-policy.yaml
- storage.yaml
configMapGenerator:
- name: prometheus-config
  files:
  - prometheus.yml=config/prometheus.yml
  - alerts.yml=config/alerts.yml
- name: grafana-config
  files:
  - grafana.ini=config/grafana.ini
- name: grafana-datasources
  files:
  - datasources.yml=config/datasources.yml
- name: grafana-providers
  files:
  - dashboards.yml=config/dashboards.yml
- name: grafana-dashboards
  files:
  - application.json=dashboards/application.json
  - services.json=dashboards/services.json
  - nodes.json=dashboards/nodes.json
  - monitoring.json=dashboards/monitoring.json
