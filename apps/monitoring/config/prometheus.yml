global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    cluster: matchlab
rule_files:
- /etc/prometheus/alerts.yml
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets: ['localhost:9090']
  sample_limit: 5000
- job_name: matchlab-services
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names: [matchlab]
  relabel_configs:
  - source_labels: [__meta_kubernetes_pod_phase]
    action: keep
    regex: Running
  - source_labels: [__meta_kubernetes_pod_container_port_name]
    action: keep
    regex: metrics
  - source_labels: [__meta_kubernetes_pod_label_app]
    action: keep
    regex: gateway|auth|user|mail|media|support|project|search|recommendation|admin
  - source_labels: [__meta_kubernetes_pod_label_app]
    target_label: service
  - source_labels: [__meta_kubernetes_pod_name]
    target_label: pod
  - source_labels: [__meta_kubernetes_namespace]
    target_label: namespace
  - source_labels: [__meta_kubernetes_pod_node_name]
    target_label: node
  sample_limit: 6000
  label_limit: 20
  body_size_limit: 8MB
- job_name: node-exporter
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names: [matchlab]
  relabel_configs:
  - source_labels: [__meta_kubernetes_pod_label_app, __meta_kubernetes_pod_container_port_number]
    action: keep
    regex: node-exporter;9100
  - source_labels: [__meta_kubernetes_pod_node_name]
    target_label: node
  sample_limit: 5000
- job_name: kube-state-metrics
  static_configs:
  - targets: ['kube-state-metrics:8080']
  metric_relabel_configs:
  - source_labels: [__name__]
    action: keep
    regex: kube_node_status_condition|kube_pod_info|kube_pod_labels|kube_pod_container_info|kube_pod_container_status_.*|kube_pod_container_resource_.*|kube_deployment_status_replicas.*|kube_deployment_spec_replicas|kube_statefulset_status_replicas.*|kube_daemonset_status_.*|kube_persistentvolumeclaim_.*
  sample_limit: 10000
- job_name: cadvisor
  kubernetes_sd_configs:
  - role: node
  scheme: https
  authorization:
    credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
  tls_config:
    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  relabel_configs:
  - target_label: __address__
    replacement: kubernetes.default.svc:443
  - source_labels: [__meta_kubernetes_node_name]
    target_label: node
  - source_labels: [__meta_kubernetes_node_name]
    target_label: __metrics_path__
    replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
  metric_relabel_configs:
  - source_labels: [namespace]
    action: keep
    regex: matchlab
  - source_labels: [container]
    action: drop
    regex: '|POD'
  - source_labels: [__name__]
    action: keep
    regex: container_cpu_usage_seconds_total|container_cpu_cfs_periods_total|container_cpu_cfs_throttled_periods_total|container_memory_working_set_bytes|container_memory_rss|container_memory_cache|container_fs_usage_bytes|container_fs_limit_bytes|container_start_time_seconds
  - action: labeldrop
    regex: id|image|name
  sample_limit: 5000
- job_name: kubelet-volumes
  scrape_interval: 60s
  kubernetes_sd_configs:
  - role: node
  scheme: https
  authorization:
    credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
  tls_config:
    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  relabel_configs:
  - target_label: __address__
    replacement: kubernetes.default.svc:443
  - source_labels: [__meta_kubernetes_node_name]
    target_label: node
  - source_labels: [__meta_kubernetes_node_name]
    target_label: __metrics_path__
    replacement: /api/v1/nodes/$1/proxy/metrics
  metric_relabel_configs:
  - source_labels: [__name__]
    action: keep
    regex: kubelet_volume_stats_(used_bytes|available_bytes|capacity_bytes)
  - source_labels: [namespace]
    action: keep
    regex: matchlab
  sample_limit: 5000
