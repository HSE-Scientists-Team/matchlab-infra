[server]
root_url = https://api.matchlab.space/grafana/
serve_from_sub_path = true
[auth.anonymous]
enabled = false
[users]
allow_sign_up = false
default_theme = dark
[security]
cookie_secure = true
cookie_samesite = lax
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
[paths]
provisioning = /etc/grafana/provisioning
[log]
mode = console
[plugins]
preinstall_disabled = true
