name: Build ML BI image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s compose/ml/tests -v
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=ghcr.io/${OWNER,,}/matchlab-services/superset" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: compose/ml/superset
          push: true
          platforms: linux/amd64
          tags: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Scan published image by digest
        id: trivy-image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: image
          image-ref: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          format: sarif
          output: ${{ runner.temp }}/trivy-image.sarif
          exit-code: '0'
          ignore-unfixed: false
          timeout: 10m0s
      - name: Upload image security findings
        if: ${{ !cancelled() && steps.trivy-image.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@d0bae162f31f17dd92c46ccdc4dfee5710f8dc67 # v3
        with:
          sarif_file: ${{ runner.temp }}/trivy-image.sarif
          category: trivy-image-superset
      - name: Save image scan report
        if: ${{ !cancelled() && steps.trivy-image.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-image-superset
          path: ${{ runner.temp }}/trivy-image.sarif
          retention-days: 14
          if-no-files-found: error
      - name: Record digest
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "SUPERSET_IMAGE=$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
