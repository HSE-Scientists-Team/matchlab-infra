name: Проверить манифесты
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.1
      - name: Собрать Kustomize базы
        run: |
          for path in clusters/homelab apps/secrets apps/platform apps/backend apps/cert-manager apps/tls apps/monitoring apps/ml apps/backend-ml; do
            kubectl kustomize "$path" > /dev/null
          done
      - name: Проверить ML pilot
        run: python3 -m unittest discover -s compose/ml/tests -v
      - name: Проверить контракты мониторинга
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: Проверить конфигурацию Prometheus и alert rules
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD/apps/monitoring/config:/etc/prometheus:ro" prom/prometheus:v3.15.0 check config --syntax-only /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/apps/monitoring/config:/etc/prometheus:ro" prom/prometheus:v3.15.0 check rules /etc/prometheus/alerts.yml
      - name: Проверить shell scripts
        run: bash -n scripts/prepare-metrics-volume.sh scripts/prepare-metrics-disk.sh
